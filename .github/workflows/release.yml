name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Needs Xcode 26+ (src-tauri/build.rs compiles the Swift sidecar, which
    # requires the Foundation Models SDK). macos-26 ships Xcode 26.6 as its
    # default toolchain - see AGENTS.md "On-device AI sidecar".
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches project versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(awk '
            /^\[package\]$/ { package=1; next }
            /^\[/ { package=0 }
            package && /^version = / {
              sub(/^version = "/, "", $0)
              sub(/"$/, "", $0)
              print
              exit
            }
          ' src-tauri/Cargo.toml)
          if [[ "$package_version" != "$tauri_version" ||
                "$package_version" != "$cargo_version" ||
                "$TAG" != "v$package_version" ]]; then
            printf 'Tag %s does not match all project versions\n' "$TAG" >&2
            printf 'package=%s, tauri=%s, cargo=%s\n' \
              "$package_version" "$tauri_version" "$cargo_version" >&2
            exit 1
          fi

      - name: Generate release notes
        id: git-cliff
        # v4.9.1
        uses: >-
          orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
        with:
          version: v2.14.2
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      # v6.0.9
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # No signing identity is configured, so this produces an unsigned
      # .app/.dmg.
      - run: pnpm tauri build

      - name: Zip the .app bundle for upload
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent openrize.app openrize.app.zip

      - name: Create GitHub Release
        # v3.0.2
        uses: >-
          softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/openrize.app.zip
          body: |
            ${{ steps.git-cliff.outputs.content }}

            ---

            Unsigned macOS build - no Apple Developer signing or notarization
            yet.

            On first launch, macOS Gatekeeper will refuse to open the app.
            Right-click (or Control-click) `openrize.app` and choose **Open**,
            or go to **System Settings > Privacy & Security** and click
            **Open Anyway**, then confirm. You only need to do this once.
