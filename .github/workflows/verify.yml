name: Verify

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-ci'
    strategy:
      fail-fast: false
      matrix:
        # macOS needs Xcode 26+ (src-tauri/build.rs compiles the Swift
        # sidecar, which requires the Foundation Models SDK). macos-26 ships
        # Xcode 26.6 as its default toolchain - see AGENTS.md "On-device AI
        # sidecar". Windows checks the same code with its own cfg branches.
        runner: [macos-26, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Git Bash on Windows, so `pnpm verify` runs scripts/verify.sh as-is.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v6.1.0 (pnpm 12 support; v6.0.9 breaks pnpm 12 on Windows)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Check only - never `pnpm fix` or an auto-commit in CI.
      - run: pnpm verify
