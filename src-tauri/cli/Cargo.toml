[package]
name = "openrize-cli"
version = "0.8.10"
edition = "2021"
license = "AGPL-3.0-only"
description = "Read-only OpenRize CLI and on-demand local service, independent of the desktop app"

[[bin]]
name = "openrize"
path = "src/main.rs"

[dependencies]
openrize-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
