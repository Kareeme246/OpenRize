# Having any file here is what makes Tauri check app commands against the capabilities at all. A
# command is then rejected in every window whose permission does not list it; the test in
# `src/lib.rs` fails when these lists and `generate_handler!` drift apart.

[[permission]]
identifier = "main-window"
description = "The app commands the main window calls."
commands.allow = [
  "set_maximize_button",
  "show_system_menu",
  "list_timers",
  "create_timer",
  "start_timer",
  "pause_timer",
  "reset_timer",
  "rename_timer",
  "set_timer_tag",
