name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Needs Xcode 26+ (src-tauri/build.rs compiles the Swift sidecar, which
    # requires the Foundation Models SDK). macos-26 ships Xcode 26.6 as its
    # default toolchain - see AGENTS.md "On-device AI sidecar".
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches project versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(awk '
            /^\[package\]$/ { package=1; next }
            /^\[/ { package=0 }
            package && /^version = / {
              sub(/^version = "/, "", $0)
              sub(/"$/, "", $0)
              print
              exit
            }
          ' src-tauri/Cargo.toml)
          if [[ "$package_version" != "$tauri_version" ||
                "$package_version" != "$cargo_version" ||
                "$TAG" != "v$package_version" ]]; then
            printf 'Tag %s does not match all project versions\n' "$TAG" >&2
            printf 'package=%s, tauri=%s, cargo=%s\n' \
              "$package_version" "$tauri_version" "$cargo_version" >&2
            exit 1
          fi

      - name: Generate release notes
        id: git-cliff
        # v4.9.1
        uses: >-
          orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
        with:
          version: v2.14.2
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      # v6.0.9
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      # Signed release artifacts must be compiled from the locked sources,
      # never restored from lower-trust dependency or compiler-output caches.

      - run: pnpm install --frozen-lockfile

      # The Tauri CLI imports APPLE_CERTIFICATE into a temporary keychain,
      # signs the app and the ML sidecar with the Developer ID identity, then
      # notarizes and staples using the App Store Connect API key. It also
      # packs the in-app updater's openrize.app.tar.gz and signs it with the
      # TAURI_SIGNING_PRIVATE_KEY minisign key. See RELEASING.md for how these
      # secrets are produced.
      - name: Write App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - run: pnpm tauri build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify signature and notarization
        run: |
          app=src-tauri/target/release/bundle/macos/openrize.app
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Zip the .app bundle for upload
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent openrize.app openrize.app.zip

      # The in-app updater reads this from releases/latest/download/latest.json
      # (plugins.updater.endpoints in tauri.conf.json). CI only builds on
      # Apple Silicon, so darwin-aarch64 is the only platform.
      - name: Write updater manifest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bundle=src-tauri/target/release/bundle/macos
          jq -n \
            --arg version "${TAG#v}" \
            --rawfile notes release-notes.md \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/$REPOSITORY/releases/download/$TAG/openrize.app.tar.gz" \
            --rawfile signature "$bundle/openrize.app.tar.gz.sig" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $url, signature: $signature }
              }
            }' > latest.json
          cat latest.json

      - name: Create GitHub Release
        # v3.0.2
        uses: >-
          softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/openrize.app.zip
            src-tauri/target/release/bundle/macos/openrize.app.tar.gz
            latest.json
          body: |
            ${{ steps.git-cliff.outputs.content }}
