name: Verify

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-ci'
    # Needs Xcode 26+ (src-tauri/build.rs compiles the Swift sidecar, which
    # requires the Foundation Models SDK). macos-26 ships Xcode 26.6 as its
    # default toolchain - see AGENTS.md "On-device AI sidecar".
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Check only - never `pnpm fix` or an auto-commit in CI.
      - run: pnpm verify
