name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z, without v)
        required: true
        type: string
      macos_arm:
        description: Build macOS ARM
        type: boolean
        default: true
      windows:
        description: Build Windows x64 (unsigned NSIS installer)
        type: boolean
        default: false
      r2:
        description: Also publish selected installers to the website's R2 bucket
        type: boolean
        default: false
      scope:
        description: Artifact scope
        type: choice
        options: [standard, comprehensive]
        default: standard

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # Releases are cut from main only. On any other ref this job is skipped, and with it every job
    # below.
    if: github.ref == 'refs/heads/main'
    # Pinned LTS image so runner-image migrations cannot silently change the environment.
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify requested version matches project versions
        id: version
        env:
          TAG: v${{ inputs.version }}
          MACOS_ARM: ${{ inputs.macos_arm }}
          WINDOWS: ${{ inputs.windows }}
          SCOPE: ${{ inputs.scope }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$MACOS_ARM" == true || "$WINDOWS" == true ]] || exit 1
          [[ "$SCOPE" == standard || "$SCOPE" == comprehensive ]] || exit 1
          package_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(awk '
            /^\[package\]$/ { package=1; next }
            /^\[/ { package=0 }
            package && /^version = / {
              sub(/^version = "/, "", $0)
              sub(/"$/, "", $0)
              print
              exit
            }
          ' src-tauri/Cargo.toml)
          for manifest in src-tauri/cli/Cargo.toml src-tauri/core/Cargo.toml; do
            version=$(awk -F '"' '/^version = / { print $2; exit }' "$manifest")
            if [[ "$version" != "$package_version" ]]; then
              printf '%s version does not match the release\n' "$manifest" >&2
              exit 1
            fi
          done
          for version in "$tauri_version" "$cargo_version" "${TAG#v}"; do
            if [[ "$version" != "$package_version" ]]; then
              printf 'Tag %s does not match all project versions\n' "$TAG" >&2
              exit 1
            fi
          done

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # The only job before publishing that holds a write token, and this is its only step.
  tag:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create tag or verify existing tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              throw new Error(`Release ${tag} already exists; refusing to mix asset sets`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let ref;
            try {
              ({ data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` }));
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha });
              return;
            }

            let object = ref.object;
            while (object.type === "tag") {
              ({ data: { object } } = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha }));
            }
            if (object.type !== "commit" || object.sha !== context.sha) {
              throw new Error(`Tag ${tag} points at another commit`);
            }

  # Read-only, and no token is passed to git-cliff: cliff.toml uses git history alone.
  notes:
    needs: [prepare, tag]
    runs-on: ubuntu-24.04
    env:
      GIT_CLIFF_VERSION: 2.14.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch release tag for notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: git fetch origin "refs/tags/$TAG:refs/tags/$TAG"

      # Upstream release assets are mutable, so the archive must match the SHA-256 committed here.
      # To upgrade, change the version and this digest together.
      - name: Download and verify git-cliff
        env:
          GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        run: |
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/$archive"
          echo "$GIT_CLIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"

      - name: Generate release notes
        run: |
          "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" --config cliff.toml \
            --latest --strip header --output release-notes.md

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  macos:
    needs: notes
    if: inputs.macos_arm
    # Xcode 26+ is required by the Swift ML sidecar. Only Apple Silicon.
    runs-on: macos-26
    # See "Repository settings" in RELEASING.md.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # v6.1.0 (pnpm 12 support; v6.0.9 breaks pnpm 12 on Windows)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      # Signed release artifacts must be built from locked sources, never from lower-trust caches.
      # That includes the compiler: this installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update

      - run: pnpm install --frozen-lockfile

      # Compile with no secrets: the frontend build, every crate's build script and proc macro, and
      # build.rs all run here. `--locked` fails the build if Cargo.lock is out of date.
      - run: pnpm tauri build --no-bundle -- --locked

      # The Tauri CLI signs and notarizes the app and ML sidecar, and packs and minisigns the
      # updater's openrize.app.tar.gz (TAURI_SIGNING_PRIVATE_KEY). It compiles nothing, so the
      # secrets exist only from here on. See RELEASING.md for the secrets.
      - name: Write App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - run: pnpm tauri bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify signature and notarization
        run: |
          app=src-tauri/target/release/bundle/macos/openrize.app
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      # install.sh accepts the CLI from the updater tarball only under this exact requirement; check
      # it first.
      - name: Verify the bundled CLI passes the installer's check
        run: |
          cli=src-tauri/target/release/bundle/macos/openrize.app/Contents/MacOS/rize
          requirement=$(sed -n "s/^requirement='\(.*\)'$/\1/p" install.sh)
          [[ -n "$requirement" ]]
          codesign --verify --strict --check-notarization --verbose=2 \
            -R="$requirement" "$cli"

      # The website publisher (scripts/publish-r2) accepts the DMG only with this signature. The
      # bundle step signs just the updater tarball, so sign the DMG here with the same key.
      - name: Sign the DMG with the updater key
        env:
          VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri signer sign \
            "src-tauri/target/release/bundle/dmg/openrize_${VERSION}_aarch64.dmg"

      - name: Zip the .app bundle for upload
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent openrize.app openrize.app.zip

      - name: Stage selected macOS assets
        env:
          VERSION: ${{ inputs.version }}
          SCOPE: ${{ inputs.scope }}
        run: |
          mkdir release-assets
          cp "src-tauri/target/release/bundle/dmg/openrize_${VERSION}_aarch64.dmg" release-assets/
          cp "src-tauri/target/release/bundle/dmg/openrize_${VERSION}_aarch64.dmg.sig" release-assets/
          cp src-tauri/target/release/bundle/macos/openrize.app.tar.gz release-assets/
          cp src-tauri/target/release/bundle/macos/openrize.app.tar.gz.sig release-assets/
          if [[ "$SCOPE" == comprehensive ]]; then
            cp src-tauri/target/release/bundle/macos/openrize.app.zip release-assets/
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-assets-macos
          path: release-assets/*
          if-no-files-found: error

  windows:
    needs: notes
    if: inputs.windows
    # Pinned image, like the other jobs. It is what windows-latest resolves to today.
    runs-on: windows-2025
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: rustup toolchain install --no-self-update
      - run: pnpm install --frozen-lockfile
      # Compile with no secrets, then bundle with the key, as in the macOS job.
      - run: pnpm tauri build --no-bundle -- --locked
      # NSIS remains unsigned; the separate minisign key authenticates updates.
      - run: pnpm tauri bundle --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Installs the unsigned installer as a user would; checks app and rize land in the install
      # folder, rize is on PATH once (even after an update), uninstall removes PATH and login item.
      # Each action is bounded so a hang fails in seconds.
      - name: Smoke test the Windows installer
        timeout-minutes: 6
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/windows-installer-smoke.sh
      # Tauri names the installer after the product (OpenRize); the release
      # keeps the lowercase names its macOS assets, latest.json and the R2
      # publisher already use. The signature covers the bytes, not the name.
      - name: Stage Windows installer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir release-assets
          cp "src-tauri/target/release/bundle/nsis/OpenRize_${VERSION}_x64-setup.exe" "release-assets/openrize_${VERSION}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/nsis/OpenRize_${VERSION}_x64-setup.exe.sig" "release-assets/openrize_${VERSION}_x64-setup.exe.sig"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-assets-windows
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [prepare, notes, macos, windows]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.notes.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    # Pinned LTS image so runner-image migrations cannot silently change the environment.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes
      # Every release carries a complete manifest for precisely its selected platforms.
      - name: Write updater manifest
        env:
          VERSION: ${{ inputs.version }}
          MACOS_ARM: ${{ inputs.macos_arm }}
          WINDOWS: ${{ inputs.windows }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n --arg version "$VERSION" --rawfile notes release-notes.md \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {}}' \
            > release-assets/latest.json
          add_platform() {
            jq --arg platform "$1" \
              --arg url "https://github.com/$REPOSITORY/releases/download/v$VERSION/$2" \
              --rawfile signature "release-assets/$2.sig" \
              '.platforms[$platform] = {url: $url, signature: $signature}' \
              release-assets/latest.json > latest.tmp
            mv latest.tmp release-assets/latest.json
          }
          if [[ "$MACOS_ARM" == true ]]; then
            add_platform darwin-aarch64 openrize.app.tar.gz
          fi
          if [[ "$WINDOWS" == true ]]; then
            add_platform windows-x86_64 "openrize_${VERSION}_x64-setup.exe"
          fi

      - name: Verify exact selected asset set
        env:
          VERSION: ${{ inputs.version }}
          MACOS_ARM: ${{ inputs.macos_arm }}
          WINDOWS: ${{ inputs.windows }}
          SCOPE: ${{ inputs.scope }}
          REPOSITORY: ${{ github.repository }}
        run: |
          expected=$(mktemp)
          platforms=$(mktemp)
          echo latest.json > "$expected"
          verify_platform() {
            echo "$1" >> "$platforms"
            jq -e --arg version "$VERSION" --arg platform "$1" \
              --arg url "https://github.com/$REPOSITORY/releases/download/v$VERSION/$2" \
              --rawfile signature "release-assets/$2.sig" \
              '.version == $version and .platforms[$platform].url == $url and
               .platforms[$platform].signature == $signature' release-assets/latest.json
            # Installed copies refuse an update whose signature does not name
            # this version (requireSignedVersion), so fail here, not there.
            base64 --decode < "release-assets/$2.sig" |
              grep -q "^trusted comment: .*	version:$VERSION\$"
          }
          if [[ "$MACOS_ARM" == true ]]; then
            printf '%s\n' "openrize_${VERSION}_aarch64.dmg" \
              "openrize_${VERSION}_aarch64.dmg.sig" \
              openrize.app.tar.gz openrize.app.tar.gz.sig >> "$expected"
            if [[ "$SCOPE" == comprehensive ]]; then
              echo openrize.app.zip >> "$expected"
            fi
            verify_platform darwin-aarch64 openrize.app.tar.gz
          fi
          if [[ "$WINDOWS" == true ]]; then
            printf '%s\n' "openrize_${VERSION}_x64-setup.exe" \
              "openrize_${VERSION}_x64-setup.exe.sig" >> "$expected"
            verify_platform windows-x86_64 "openrize_${VERSION}_x64-setup.exe"
          fi
          sort -o "$expected" "$expected"
          find release-assets -type f -exec basename {} \; | sort > actual-assets.txt
          diff -u "$expected" actual-assets.txt
          sort -o "$platforms" "$platforms"
          jq -r '.platforms | keys[]' release-assets/latest.json | sort > actual-platforms.txt
          diff -u "$platforms" actual-platforms.txt
          rm "$expected" "$platforms"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: release-notes.md

  publish-r2:
    needs: publish
    if: >-
      always() && !cancelled() && inputs.r2 && needs.publish.result == 'success'
    # Reusable local calls resolve at the caller commit without a checkout.
    # Keep ./ compatibility with actionlint until it supports $/ references.
    uses: ./.github/workflows/publish-r2.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ inputs.version }}
      macos_arm: ${{ inputs.macos_arm }}
      windows: ${{ inputs.windows }}
      r2: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
