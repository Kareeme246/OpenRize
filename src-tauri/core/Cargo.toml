[package]
name = "openrize-core"
version = "0.9.54"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
interprocess = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Same version interprocess uses, for its security descriptor strings.
widestring = "1"
# Same version the app uses, to compare the pipe peer's user with ours.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# Same version the app and rize use, for the user PATH (user_path.rs).
windows-registry = "0.6"
