[changelog]
header = "# Changelog\n\nAll notable changes are documented here. Entries are generated from commit history.\n\n"
body = """
{% if version %}## [{{ version | trim_start_matches(pat=\"v\") }}] - {{ timestamp | date(format=\"%Y-%m-%d\") }}{% else %}## [unreleased]{% endif %}
{% for group in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ group.group }}
{% for commit in group.commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\\n") | first | upper_first }}{% if commit.breaking %} (breaking){% endif %}
{% endfor %}{% endfor %}
"""
trim = true
postprocessors = [
  { pattern = "—", replace = "-" },
]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^chore|^ci|^build", group = "Maintenance" },
  { message = "^revert", group = "Reverts" },
  { message = "^Bump version to", skip = true },
  { message = ".*", group = "Other Changes" },
]
