[package]
name = "openrize-core"
version = "0.8.10"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
# The same resolver Tauri uses for app_data_dir, so paths.rs cannot drift.
dirs = "6"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
# Unix sockets and Windows named pipes behind one local-socket API.
interprocess = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Same version interprocess uses, for its security descriptor strings.
widestring = "1"
# Same version the app uses, to compare the pipe peer's user with ours.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }
